plugins {
    id 'com.android.library'
}
android {
    namespace 'com.khetigaadi.pick_image'
    //noinspection GrDeprecatedAPIUsage
    compileSdk 36 // Integer.parseInt(project.COMPILE_SDK_VERSION)
    defaultConfig {
        //minSdk 21 // Integer.parseInt(project.MIN_SDK)
        minSdkVersion 23
       // targetSdk 34 //Integer.parseInt(project.TARGET_SDK_VERSION)
        //noinspection OldTargetApi
        targetSdkVersion 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }
    buildFeatures {
        viewBinding = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
       // sourceCompatibility JavaVersion.VERSION_1_8
       // targetCompatibility JavaVersion.VERSION_1_8

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

//    kotlinOptions {
//        jvmTarget = "17"
//    }

//    kotlin {
//        jvmToolchain(17)
//    }
}
dependencies {
    implementation libs.androidx.appcompat.v171
    implementation libs.material.v1120
    implementation libs.androidx.constraintlayout.v210
    testImplementation libs.junit4
    androidTestImplementation libs.androidx.junit.v130
    androidTestImplementation libs.androidx.espresso.core.v370
    implementation libs.timber
    implementation libs.ucrop.v227
    implementation libs.glide.v4120

   // implementation 'com.google.android.play:core version 1.10.3'
}