apply plugin: 'com.android.application'
apply plugin: 'dagger.hilt.android.plugin'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
android {
    namespace 'com.khetigaadi'
    signingConfigs {
        config {
           // storeFile file('D:\\projects\\khetigaadi\\khetiGaadiSignInKey.jks')
            storeFile file("/Users/kgapp/Downloads/khetigaadi-latest/khetiGaadiSignInKey.jks")
            // /Users/kgapp/Downloads/khetigaadi-latest/khetiGaadiSignInKey.jks
            storePassword PRODUCTION_KEYSTORE_PASSWORD
            keyAlias PRODUCTION_KEY_ALIAS
            keyPassword PRODUCTION_KEY_PASSWORD
        }
    }
    compileSdkVersion = libs.versions.compileSdkVersion.get().toInteger()
    defaultConfig {
        applicationId 'com.khetigaadi'
        //namespace 'com.khetigaadi'
        minSdkVersion    libs.versions.minSdkVersion.get().toInteger()
        targetSdkVersion libs.versions.targetSdkVersion.get().toInteger()
        versionCode 98
        versionName "5.4.19"
        buildConfigField "int", "APP_TYPE", "1"
        buildConfigField "int", "APP_DATA_VERSION", "22"
        multiDexEnabled true
        signingConfig signingConfigs.config
//      testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunner "com.khetigaadi.CustomTestRunner"
        testInstrumentationRunner "dagger.hilt.android.testing.HiltTestRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation"  : "$projectDir/schemas".toString(),
                        "room.incremental"     : "true",
                        "room.expandProjection": "true"]
                ["dagger.gradle.incremental": "true"]
            }
        }
    }
    // Add this block and enable/disable the parameters as follows
    bundle {
        density {
            // Different APKs are generated for devices with different screen densities; true by default.
            enableSplit true
        }
        abi {
            // Different APKs are generated for devices with different CPU architectures; true by default.
            enableSplit true
        }
        language {
            // This is disabled so that the App Bundle does NOT split the APK for each language.
            // We're gonna use the same APK for all languages.
            enableSplit false
        }
    }
    buildFeatures {
        viewBinding true
    }
    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        //noinspection GrDeprecatedAPIUsage
        jvmTarget = "17"
    }
    kotlin {
        jvmToolchain(17)
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    packagingOptions{
        jniLibs {
            useLegacyPackaging = true
        }
      //  exclude 'lib/x86_64/libtool-checker.so'
    }
    buildTypes {
        debug {
            manifestPlaceholders = [crashlyticsCollectionEnabled: "false"]
//            buildConfigField "String", "BASE_URL",  "\"http://15.206.168.86/\""
            buildConfigField "String","BASE_URL","\"https://khetigaadi.com/\""
        }
        release {
            minifyEnabled false // Enables code shrinking for the release build type.
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [crashlyticsCollectionEnabled: "true"]
            buildConfigField "String", "BASE_URL", "\"https://khetigaadi.com/\""
        }
    }
    dexOptions {
        preDexLibraries = false
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    namespace 'com.khetigaadi'
    configurations.configureEach {
        resolutionStrategy.force 'com.google.code.findbugs:jsr305:1.3.9'
    }
}
 repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
    maven { url 'https://oss.jfrog.org/artifactory/oss-snapshot-local' }
    google()
}
